      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation, tenant_name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
        tenant_name: { type: string }
        industry: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        tenant_id: { type: integer, minimum: 1 }
        device_name: { type: string }
    AcceptInvitationRequest:
      type: object
      required: [password]
      properties:
        name: { type: string, maxLength: 120, description: Required for a new account. }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password, description: Required for a new account. }
    EntityDefinitionRequest:
      type: object
      required: [name, label]
      properties:
        name: { type: string, maxLength: 160 }
        label: { type: string, maxLength: 160 }
        settings: { type: object, additionalProperties: true }
        active: { type: boolean }
    FieldDefinitionRequest:
      type: object
      required: [name, label, type]
      oneOf:
        - required: [entity_type]
        - required: [entity_definition_id]
      properties:
        entity_type:
          type: string
          enum: [contacts, organizations, leads, deals, tasks, activities]
        entity_definition_id: { type: integer, minimum: 1 }
        name: { type: string, pattern: '^[a-z][a-z0-9_]{1,79}$' }
        label: { type: string, maxLength: 160 }
        type: { type: string }
        required: { type: boolean }
        options: { type: array, items: { type: string } }
        validation_rules: { type: object, additionalProperties: true }
        default_value: {}
        position: { type: integer, minimum: 0 }
        active: { type: boolean }
    Contact:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        owner_id: { type: integer }
        status: { type: string }
        custom_fields: { type: object, additionalProperties: true }
    Organization:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        website: { type: string, format: uri }
        custom_fields: { type: object, additionalProperties: true }
    Lead:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        source: { type: string }
        status: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        custom_fields: { type: object, additionalProperties: true }
    Deal:
      type: object
      required: [pipeline_id, stage_id, name, value, currency]
      properties:
        pipeline_id: { type: integer, minimum: 1 }
        stage_id: { type: integer, minimum: 1 }
        owner_id: { type: integer, nullable: true, minimum: 1 }
        sales_team_id: { type: integer, nullable: true, minimum: 1 }
        branch_id: { type: integer, nullable: true, minimum: 1, description: Inferred from team or territory when omitted. }
        territory_id: { type: integer, nullable: true, minimum: 1 }
        contact_id: { type: integer, nullable: true, minimum: 1 }
        organization_id: { type: integer, nullable: true, minimum: 1 }
        name: { type: string, maxLength: 190 }
        value: { $ref: '#/components/schemas/DecimalAmount' }
        currency: { type: string, minLength: 3, maxLength: 3, pattern: '^[A-Za-z]{3}$' }
        status: { type: string, enum: [open, won, lost], default: open }
        forecast_category: { type: string, enum: [omitted, pipeline, best_case, commit, closed], default: pipeline }
        expected_close_date: { type: string, format: date, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true, readOnly: true }
        pipeline: { type: object, readOnly: true, additionalProperties: true }
        stage: { type: object, readOnly: true, additionalProperties: true }
        team: { type: object, nullable: true, readOnly: true, additionalProperties: true }
        branch: { type: object, nullable: true, readOnly: true, additionalProperties: true }
        territory: { type: object, nullable: true, readOnly: true, additionalProperties: true }
        custom_fields: { type: object, additionalProperties: true }
    ContactDuplicateCheck:
      type: object
