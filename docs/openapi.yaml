      responses: {'200': {$ref: '#/components/responses/KnowledgeDeletedResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /knowledge/articles:
    get:
      tags: [Knowledge Base]
      summary: List tenant knowledge articles
      operationId: listKnowledgeArticles
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantHeader'}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}}
        - {name: visibility, in: query, schema: {type: string, enum: [PUBLIC, CUSTOMER, INTERNAL]}}
        - {name: category_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: tag_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: has_unpublished_changes, in: query, schema: {type: boolean}}
        - {name: created_from, in: query, schema: {type: string, format: date}}
        - {name: created_to, in: query, schema: {type: string, format: date}}
        - {name: sort, in: query, schema: {type: string, enum: [created_at, updated_at, title, status]}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      responses: {'200': {$ref: '#/components/responses/KnowledgeArticleSummaryList'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/ValidationError'}}
    post:
      tags: [Knowledge Base]
      summary: Create a draft knowledge article
      operationId: createKnowledgeArticle
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeArticleCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /knowledge/articles/{article}:
    get:
      tags: [Knowledge Base]
      summary: View an internal knowledge article
      operationId: showKnowledgeArticle
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}]
      responses: {'200': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
    patch:
      tags: [Knowledge Base]
      summary: Create the next immutable article revision
      operationId: reviseKnowledgeArticle
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeArticleUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /knowledge/articles/{article}/versions:
    get:
      tags: [Knowledge Base]
      summary: List article revision metadata
      operationId: listKnowledgeArticleVersions
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}]
      responses: {'200': {$ref: '#/components/responses/KnowledgeVersionList'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /knowledge/articles/{article}/versions/{version}:
    get:
      tags: [Knowledge Base]
      summary: View an immutable article revision
      operationId: showKnowledgeArticleVersion
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}, {$ref: '#/components/parameters/KnowledgeVersion'}]
      responses: {'200': {$ref: '#/components/responses/KnowledgeVersionResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /knowledge/articles/{article}/versions/{version}/restore:
    post:
      tags: [Knowledge Base]
      summary: Restore a revision into the next editable version
      operationId: restoreKnowledgeArticleVersion
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}, {$ref: '#/components/parameters/KnowledgeVersion'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeExpectedVersion'}}}}
      responses: {'201': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /knowledge/articles/{article}/publish:
    post:
      tags: [Knowledge Base]
      summary: Publish the expected revision
      operationId: publishKnowledgeArticle
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeExpectedVersion'}}}}
      responses: {'200': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /knowledge/articles/{article}/archive:
    post:
      tags: [Knowledge Base]
      summary: Archive a published article
      operationId: archiveKnowledgeArticle
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}]
      responses: {'200': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /knowledge/articles/{article}/restore:
    post:
      tags: [Knowledge Base]
      summary: Restore an archived article to draft
      operationId: restoreKnowledgeArticle
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TenantHeader'}, {$ref: '#/components/parameters/KnowledgeArticleId'}]
      responses: {'200': {$ref: '#/components/responses/KnowledgeArticleDetailResponse'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /public/knowledge/{basePublicId}:
    get:
      tags: [Public Knowledge Base]
      summary: View public knowledge base home
      operationId: showPublicKnowledgeBase
      security: []
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBasePublicId'}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: category_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: tag_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [published_at, title, version], default: published_at}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses: {'200': {$ref: '#/components/responses/PublicKnowledgeBaseResponse'}, '404': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /public/knowledge/{basePublicId}/categories:
    get:
      tags: [Public Knowledge Base]
      summary: List public knowledge categories
      operationId: listPublicKnowledgeCategories
      security: []
      parameters: [{$ref: '#/components/parameters/KnowledgeBasePublicId'}]
      responses: {'200': {$ref: '#/components/responses/PublicKnowledgeCategoryList'}, '404': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  /public/knowledge/{basePublicId}/articles:
    get:
      tags: [Public Knowledge Base]
      summary: List published public articles
      operationId: listPublicKnowledgeArticles
      security: []
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBasePublicId'}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: category_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: tag_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [published_at, title, version], default: published_at}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses: {'200': {$ref: '#/components/responses/PublicKnowledgeArticleList'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/ValidationError'}, '429': {$ref: '#/components/responses/Error'}}
  /public/knowledge/{basePublicId}/articles/{articlePublicId}:
    get:
      tags: [Public Knowledge Base]
      summary: View a published public article snapshot
      operationId: showPublicKnowledgeArticle
      security: []
      parameters: [{$ref: '#/components/parameters/KnowledgeBasePublicId'}, {$ref: '#/components/parameters/KnowledgeArticlePublicId'}]
      responses: {'200': {$ref: '#/components/responses/PublicKnowledgeArticleResponse'}, '404': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}
  # END API-7.2 KNOWLEDGE PATHS

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    KnowledgeCategoryId: {name: category, in: path, required: true, schema: {type: integer, minimum: 1}}
    KnowledgeTagId: {name: tag, in: path, required: true, schema: {type: integer, minimum: 1}}
    KnowledgeArticleId: {name: article, in: path, required: true, schema: {type: integer, minimum: 1}}
    KnowledgeVersion: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    KnowledgeBasePublicId: {name: basePublicId, in: path, required: true, schema: {type: string, format: uuid}}
    KnowledgeArticlePublicId: {name: articlePublicId, in: path, required: true, schema: {type: string, format: uuid}}
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: false
      description: Must identify a tenant membership of the authenticated user.
      schema: { type: integer }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    StartsAt:
      name: starts_at
      in: query
      schema: { type: string, format: date }
    EndsAt:
      name: ends_at
      in: query
      schema: { type: string, format: date }
    AsOfDate:
      name: as_of_date
      in: query
      schema: { type: string, format: date }
    CurrencyId:
      name: currency_id
      in: query
      schema: { type: integer, minimum: 1 }
    PipelineId:
      name: pipeline_id
      in: query
      schema: { type: integer, minimum: 1 }
    OwnerId:
      name: owner_id
      in: query
      schema: { type: integer, minimum: 1 }
    TeamId:
      name: team_id
      in: query
      schema: { type: integer, minimum: 1 }
    BranchId:
      name: branch_id
      in: query
      schema: { type: integer, minimum: 1 }
    TerritoryId:
      name: territory_id
      in: query
      schema: { type: integer, minimum: 1 }
    ProductId:
      name: product_id
      in: query
      schema: { type: integer, minimum: 1 }
    Industry:
      name: industry
      in: query
      schema: { type: string, maxLength: 120 }
    Source:
      name: source
      in: query
      schema: { type: string, maxLength: 120 }
  responses:
    KnowledgeBaseResponse:
      description: Knowledge base envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/KnowledgeBase'}}}}}
    KnowledgeCategoryResponse:
      description: Knowledge category envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/KnowledgeCategory'}}}}}
    KnowledgeCategoryList:
      description: Paginated knowledge category list.
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/KnowledgeCategory'}}, meta: {type: object}}}}}
    KnowledgeTagResponse:
      description: Knowledge tag envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/KnowledgeTag'}}}}}
    KnowledgeTagList:
      description: Paginated knowledge tag list.
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/KnowledgeTag'}}, meta: {type: object}}}}}
    KnowledgeDeletedResponse:
      description: Deleted resource envelope.
      content: {application/json: {schema: {type: object, properties: {data: {type: object, properties: {deleted: {type: boolean}}}}}}}
    KnowledgeArticleDetailResponse:
      description: Internal article envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/KnowledgeArticleDetail'}}}}}
    KnowledgeArticleSummaryList:
      description: Paginated internal article list.
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/KnowledgeArticleSummary'}}, meta: {type: object}}}}}
    KnowledgeVersionResponse:
      description: Article revision envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/KnowledgeVersion'}}}}}
    KnowledgeVersionList:
      description: Paginated revision metadata list.
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/KnowledgeVersionSummary'}}, meta: {type: object}}}}}
    PublicKnowledgeBaseResponse:
      description: Public knowledge base envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/PublicKnowledgeBase'}}}}}
    PublicKnowledgeCategoryList:
      description: Public category list.
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PublicKnowledgeCategory'}}}}}}
    PublicKnowledgeArticleList:
      description: Paginated public article list.
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PublicKnowledgeArticleSummary'}}, meta: {type: object}}}}}
    PublicKnowledgeArticleResponse:
      description: Public article envelope.
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/PublicKnowledgeArticle'}}}}}
    Success:
      description: Successful response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Success' }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    # BEGIN API-7.2 KNOWLEDGE SCHEMAS
    KnowledgeBaseInput:
      type: object
      additionalProperties: false
      required: [title]
      properties: {title: {type: string, minLength: 1, maxLength: 190}, description: {type: string, nullable: true, maxLength: 5000}, is_public: {type: boolean}}
    KnowledgeCategoryInput:
      type: object
      additionalProperties: false
      properties: {name: {type: string, minLength: 1, maxLength: 120}, description: {type: string, nullable: true, maxLength: 5000}, position: {type: integer, minimum: 0, maximum: 65535}, is_active: {type: boolean}}
    KnowledgeTagInput:
      type: object
      additionalProperties: false
      properties: {name: {type: string, minLength: 1, maxLength: 80}, description: {type: string, nullable: true, maxLength: 2000}, is_active: {type: boolean}}
    KnowledgeArticleCreate:
      type: object
      additionalProperties: false
      required: [title, body_html, visibility]
      properties: {title: {type: string, minLength: 1, maxLength: 255}, summary: {type: string, nullable: true, maxLength: 1000}, body_html: {type: string, minLength: 1, maxLength: 200000}, visibility: {type: string, enum: [PUBLIC, CUSTOMER, INTERNAL]}, category_id: {type: integer, nullable: true, minimum: 1}, tag_ids: {type: array, maxItems: 20, items: {type: integer, minimum: 1}}, seo_title: {type: string, nullable: true, maxLength: 70}, seo_description: {type: string, nullable: true, maxLength: 170}, change_summary: {type: string, nullable: true, maxLength: 500}}
    KnowledgeArticleUpdate:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties: {expected_version: {type: integer, minimum: 1}, title: {type: string, minLength: 1, maxLength: 255}, summary: {type: string, nullable: true, maxLength: 1000}, body_html: {type: string, minLength: 1, maxLength: 200000}, visibility: {type: string, enum: [PUBLIC, CUSTOMER, INTERNAL]}, category_id: {type: integer, nullable: true, minimum: 1}, tag_ids: {type: array, maxItems: 20, items: {type: integer, minimum: 1}}, seo_title: {type: string, nullable: true, maxLength: 70}, seo_description: {type: string, nullable: true, maxLength: 170}, change_summary: {type: string, nullable: true, maxLength: 500}}
    KnowledgeExpectedVersion:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties: {expected_version: {type: integer, minimum: 1}}
    KnowledgeBase:
      type: object
      properties: {id: {type: integer, readOnly: true}, public_id: {type: string, format: uuid, readOnly: true}, title: {type: string}, description: {type: string, nullable: true}, is_public: {type: boolean}, tenant_id: {type: integer, readOnly: true}}
    KnowledgeCategory:
      type: object
      properties: {id: {type: integer, readOnly: true}, tenant_id: {type: integer, readOnly: true}, name: {type: string}, description: {type: string, nullable: true}, position: {type: integer}, is_active: {type: boolean}, created_by: {type: integer, readOnly: true}, created_at: {type: string, format: date-time, readOnly: true}, updated_at: {type: string, format: date-time, readOnly: true}}
    KnowledgeTag:
      type: object
      properties: {id: {type: integer, readOnly: true}, tenant_id: {type: integer, readOnly: true}, name: {type: string}, description: {type: string, nullable: true}, is_active: {type: boolean}, created_by: {type: integer, readOnly: true}, created_at: {type: string, format: date-time, readOnly: true}, updated_at: {type: string, format: date-time, readOnly: true}}
    KnowledgeArticleSummary:
      type: object
      properties: {id: {type: integer, readOnly: true}, public_id: {type: string, format: uuid, readOnly: true}, status: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], readOnly: true}, current_version: {$ref: '#/components/schemas/KnowledgeVersionSummary'}, published_version: {$ref: '#/components/schemas/KnowledgeVersionSummary'}, has_unpublished_changes: {type: boolean, readOnly: true}}
    KnowledgeArticleDetail:
      allOf: [{$ref: '#/components/schemas/KnowledgeArticleSummary'}, {type: object, properties: {tenant_id: {type: integer, readOnly: true}, current_version_id: {type: integer, readOnly: true}, published_version_id: {type: integer, nullable: true, readOnly: true}, created_by: {type: integer, readOnly: true}, updated_by: {type: integer, readOnly: true}, published_at: {type: string, nullable: true, format: date-time, readOnly: true}, archived_at: {type: string, nullable: true, format: date-time, readOnly: true}}}]
    KnowledgeVersionSummary:
      type: object
      properties: {id: {type: integer, readOnly: true}, version: {type: integer, readOnly: true}, title: {type: string}, summary: {type: string, nullable: true}, visibility: {type: string, enum: [PUBLIC, CUSTOMER, INTERNAL]}, change_summary: {type: string, nullable: true}}
    KnowledgeVersion:
      allOf: [{$ref: '#/components/schemas/KnowledgeVersionSummary'}, {type: object, properties: {article_id: {type: integer, readOnly: true}, category_id: {type: integer, nullable: true}, author_id: {type: integer, readOnly: true}, body_html: {type: string}, seo_title: {type: string, nullable: true}, seo_description: {type: string, nullable: true}, category: {$ref: '#/components/schemas/KnowledgeCategory'}, tags: {type: array, items: {$ref: '#/components/schemas/KnowledgeTag'}}}}]
    PublicKnowledgeBase:
      type: object
      properties: {public_id: {type: string, format: uuid, readOnly: true}, title: {type: string}, description: {type: string, nullable: true}}
    PublicKnowledgeCategory:
      type: object
      properties: {name: {type: string}, description: {type: string, nullable: true}, position: {type: integer}}
    PublicKnowledgeTag:
      type: object
      properties: {name: {type: string}, description: {type: string, nullable: true}}
    PublicKnowledgeArticleSummary:
      type: object
      properties: {public_id: {type: string, format: uuid}, title: {type: string}, summary: {type: string, nullable: true}, category: {$ref: '#/components/schemas/PublicKnowledgeCategory'}, tags: {type: array, items: {$ref: '#/components/schemas/PublicKnowledgeTag'}}, seo_title: {type: string, nullable: true}, seo_description: {type: string, nullable: true}, version: {type: integer, minimum: 1}, published_at: {type: string, format: date-time}}
    PublicKnowledgeArticle:
      allOf: [{$ref: '#/components/schemas/PublicKnowledgeArticleSummary'}, {type: object, properties: {body_html: {type: string}}}]
    # END API-7.2 KNOWLEDGE SCHEMAS
    # BEGIN API-7.1 SUPPORT SCHEMAS
    SupportPaginationMeta:
      type: object
      required:
      - current_page
      - from
      - last_page
      - per_page
      - to
      - total
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        to:
          type: integer
          nullable: true
        total:
          type: integer
          minimum: 0
    SupportDeleted:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: boolean
          readOnly: true
          example: true
    SupportAgentCreate:
      type: object
      additionalProperties: false
      required:
      - user_id
      properties:
        user_id:
          type: integer
          minimum: 1
        is_active:
          type: boolean
          default: true
    SupportAgentUpdate:
      type: object
      additionalProperties: false
      properties:
        is_active:
          type: boolean
    SupportAgent:
      type: object
      required:
      - id
      - tenant_id
      - user_id
      - is_active
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
        tenant_id:
          type: integer
          minimum: 1
          readOnly: true
        user_id:
          type: integer
          minimum: 1
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    TicketCategoryCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
          nullable: true
        is_active:
          type: boolean
      required:
      - name
    TicketCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
          nullable: true
        is_active:
          type: boolean
    TicketCategory:
      type: object
      required:
      - id
      - tenant_id
      - name
      - is_active
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          minimum: 1
          readOnly: true
        tenant_id:
          type: integer
          minimum: 1
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          nullable: true
          maxLength: 5000
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
