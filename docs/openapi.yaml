        - required: [email]
        - required: [phone]
        - required: [identification]
        - required: [tax_id]
        - required: [name]
        - required: [first_name]
        - required: [company]
      properties:
        first_name: { type: string, maxLength: 120 }
        last_name: { type: string, maxLength: 120 }
        name: { type: string, maxLength: 241 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        identification: { type: string, maxLength: 100 }
        tax_id: { type: string, maxLength: 100 }
        company: { type: string, maxLength: 190 }
        exclude_id: { type: integer, minimum: 1 }
        minimum_score: { type: integer, minimum: 1, maximum: 100, default: 25 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    CompanyDuplicateCheck:
      type: object
      anyOf:
        - required: [name]
        - required: [email]
        - required: [phone]
        - required: [website]
        - required: [identification]
        - required: [tax_id]
      properties:
        name: { type: string, maxLength: 190 }
        company: { type: string, maxLength: 190 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        website: { type: string, format: uri }
        identification: { type: string, maxLength: 100 }
        tax_id: { type: string, maxLength: 100 }
        exclude_id: { type: integer, minimum: 1 }
        minimum_score: { type: integer, minimum: 1, maximum: 100, default: 25 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    MergeRequest:
      type: object
      required: [duplicate_id]
      properties:
        duplicate_id: { type: integer, minimum: 1, description: Record absorbed into the path record. }
        field_overrides:
          type: object
          description: Whitelisted values that must win over target and source values.
          additionalProperties: true
    SavedView:
      type: object
      required: [entity_type, name]
      properties:
        entity_type:
          type: string
          enum: [contacts, companies, leads, opportunities, tasks, activities, documents, custom_objects]
        name: { type: string, maxLength: 120 }
        visibility: { type: string, enum: [private, team, tenant], default: private }
        shared_with_role_id: { type: integer, nullable: true }
        sort_field: { type: string, nullable: true }
        sort_direction: { type: string, enum: [asc, desc], nullable: true }
        columns: { type: array, maxItems: 100, items: { type: string } }
        is_default: { type: boolean, default: false }
        filters:
          type: array
          maxItems: 50
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator:
                type: string
                enum: [eq, neq, contains, starts_with, gt, gte, lt, lte, between, in, not_in, is_null, not_null]
              value: {}
