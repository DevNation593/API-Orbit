        metadata: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    Integration:
      type: object
      required: [provider, name]
      properties:
        provider: { type: string, example: google }
        name: { type: string }
        credentials: { type: object, writeOnly: true, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, active, disabled], readOnly: true }
        last_synced_at: { type: string, format: date-time, nullable: true, readOnly: true }
    InboxChannelType:
      type: string
      enum: [email, whatsapp, sms, web_chat, facebook, instagram, telegram, call]
    ConversationStatus:
      type: string
      enum: [open, pending, waiting_customer, resolved, closed]
    InboxChannelRequest:
      type: object
      required: [channel, name]
      properties:
        channel: { $ref: '#/components/schemas/InboxChannelType' }
        name: { type: string, maxLength: 120 }
        address: { type: string, nullable: true, maxLength: 190 }
        external_identifier: { type: string, nullable: true, maxLength: 190 }
        integration_id: { type: integer, nullable: true, minimum: 1 }
        settings: { type: object, nullable: true, additionalProperties: true }
        status: { type: string, enum: [active, inactive], default: active }
    InboxRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 2000 }
        status: { type: string, enum: [active, inactive], default: active }
        default_assignee_id: { type: integer, nullable: true, minimum: 1 }
        default_role_id: { type: integer, nullable: true, minimum: 1 }
        channels:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/InboxChannelRequest' }
    ConversationRequest:
      type: object
      required: [inbox_id, inbox_channel_id]
      properties:
        inbox_id: { type: integer, minimum: 1 }
        inbox_channel_id: { type: integer, minimum: 1 }
        contact_id: { type: integer, nullable: true, minimum: 1 }
        assigned_user_id: { type: integer, nullable: true, minimum: 1 }
        assigned_role_id: { type: integer, nullable: true, minimum: 1 }
        subject: { type: string, nullable: true, maxLength: 255 }
        external_identifier: { type: string, nullable: true, maxLength: 190 }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
    ConversationAssignmentRequest:
      type: object
      required: [assigned_user_id, assigned_role_id]
      properties:
        assigned_user_id: { type: integer, nullable: true, minimum: 1 }
        assigned_role_id: { type: integer, nullable: true, minimum: 1 }
        reason: { type: string, nullable: true, maxLength: 255 }
    MessageRequest:
      type: object
      anyOf:
        - required: [body]
        - required: [content]
        - required: [file_ids]
      properties:
        type:
          type: string
          enum: [text, image, video, document, audio, template, email, system]
        subject: { type: string, nullable: true, maxLength: 255 }
        body: { type: string, nullable: true, maxLength: 100000 }
        content: { type: object, nullable: true, additionalProperties: true }
        reply_to_id: { type: integer, nullable: true, minimum: 1 }
        file_ids: { type: array, maxItems: 20, items: { type: integer, minimum: 1 } }
        client_message_id: { type: string, nullable: true, maxLength: 190, pattern: '^[A-Za-z0-9._:-]+$' }
        is_internal: { type: boolean, default: false }
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Future instant; persisted until the scheduler safely dispatches it.
    CannedResponseRequest:
      type: object
      required: [title, shortcut, body]
      properties:
        title: { type: string, maxLength: 120 }
        shortcut: { type: string, maxLength: 80, pattern: '^[A-Za-z0-9_.-]+$' }
        body: { type: string, maxLength: 100000 }
        channel: { $ref: '#/components/schemas/InboxChannelType' }
        active: { type: boolean, default: true }
    NotificationPreferenceRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          maxItems: 100
          items:
            type: object
            required: [event, channel, enabled]
            properties:
              event: { type: string, pattern: '^(\*|[a-z][a-z0-9_.-]+)$' }
              channel: { type: string, enum: [in_app, email, push, whatsapp, sms] }
              enabled: { type: boolean }
              delivery: { type: string, enum: [immediate, daily, weekly], default: immediate }
    EmailAccountRequest:
      type: object
      required: [inbox_channel_id, integration_id, provider, email_address]
      properties:
        inbox_channel_id: { type: integer, minimum: 1 }
        integration_id: { type: integer, minimum: 1 }
        user_id: { type: integer, nullable: true, minimum: 1 }
        provider: { type: string, enum: [google, microsoft, smtp] }
        email_address: { type: string, format: email, maxLength: 190 }
        display_name: { type: string, nullable: true, maxLength: 120 }
        signature_html: { type: string, nullable: true, maxLength: 100000 }
        settings:
          type: object
          nullable: true
          properties:
            track_opens: { type: boolean }
            track_clicks: { type: boolean }
            sync_enabled: { type: boolean }
            max_attachment_bytes: { type: integer, minimum: 1, maximum: 26214400 }
        status: { type: string, enum: [active, inactive, disconnected, error] }
    EmailTemplateRequest:
      type: object
      required: [name, subject]
      anyOf:
        - required: [body_html]
        - required: [body_text]
      properties:
        name: { type: string, maxLength: 120 }
        subject: { type: string, maxLength: 255 }
        body_html: { type: string, nullable: true, maxLength: 200000 }
        body_text: { type: string, nullable: true, maxLength: 200000 }
        variables:
          type: array
          maxItems: 100
          items: { type: string, pattern: '^[a-z][a-z0-9_.]*$' }
        active: { type: boolean, default: true }
    WhatsAppAccountRequest:
      type: object
      required: [inbox_channel_id, integration_id, phone_number_id, verify_token]
      properties:
        inbox_channel_id: { type: integer, minimum: 1 }
        integration_id: { type: integer, minimum: 1 }
        business_account_id: { type: string, nullable: true, maxLength: 190 }
        phone_number_id: { type: string, maxLength: 190 }
        display_phone_number: { type: string, nullable: true, maxLength: 80 }
        verify_token: { type: string, minLength: 16, maxLength: 190, writeOnly: true }
        settings: { type: object, nullable: true, additionalProperties: true }
        status: { type: string, enum: [active, inactive, disconnected, error] }
    FormFieldDefinition:
      type: object
      required: [field_key, label, type]
      properties:
        field_key: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 120 }
        label: { type: string, maxLength: 190 }
        type: { type: string, enum: [text, textarea, email, phone, number, date, datetime, select, multi_select, checkbox, radio, file, custom_field] }
        mapping_target: { type: string, nullable: true, maxLength: 190 }
        field_definition_id: { type: integer, nullable: true, minimum: 1 }
        placeholder: { type: string, nullable: true, maxLength: 255 }
        help_text: { type: string, nullable: true, maxLength: 2000 }
        options: { type: array, nullable: true, maxItems: 100, items: {} }
        validation_rules: { type: object, nullable: true, additionalProperties: true }
        default_value: {}
        settings: { type: object, nullable: true, additionalProperties: true }
        required: { type: boolean, default: false }
        position: { type: integer, minimum: 0, maximum: 65535 }
        active: { type: boolean, default: true }
    FormDefinitionRequest:
      type: object
      required: [name, title, fields]
      properties:
        name: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 190 }
        description: { type: string, nullable: true, maxLength: 10000 }
        status: { type: string, enum: [draft, published, archived], default: draft }
        success_message: { type: string, nullable: true, maxLength: 2000 }
        redirect_url: { type: string, format: uri, nullable: true, maxLength: 2000 }
        active_from: { type: string, format: date-time, nullable: true }
        active_until: { type: string, format: date-time, nullable: true }
        settings:
          type: object
          nullable: true
          properties:
            create_lead: { type: boolean, default: true }
            create_contact: { type: boolean, default: false }
            duplicate_strategy: { type: string, enum: [create, update, reject], default: update }
            automation_id: { type: integer, nullable: true, minimum: 1 }
            captcha_required: { type: boolean, default: false }
            require_form_session: { type: boolean, default: true }
            minimum_fill_seconds: { type: integer, minimum: 0, maximum: 300, default: 2 }
            session_lifetime_minutes: { type: integer, minimum: 1, maximum: 1440, default: 120 }
            honeypot_enabled: { type: boolean, default: true }
        fields: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/FormFieldDefinition' } }
    PublicFormSubmissionRequest:
      type: object
      required: [fields]
      properties:
        fields: { type: object, additionalProperties: true }
        attribution: { type: object, additionalProperties: { type: string } }
        form_session: { type: string, nullable: true }
        captcha_token: { type: string, nullable: true, maxLength: 2048 }
        idempotency_key: { type: string, nullable: true, minLength: 8, maxLength: 190 }
        _honeypot: { type: string, nullable: true, maxLength: 500 }
    RuleCondition:
      type: object
      required: [field, operator]
      properties:
        field: { type: string, maxLength: 190 }
        operator:
          type: string
          enum: [eq, neq, contains, not_contains, starts_with, ends_with, gt, gte, lt, lte, in, not_in, is_null, not_null, is_empty, is_not_empty, before, after]
        value: {}
        position: { type: integer, minimum: 0, maximum: 65535 }
    LeadRoutingRuleRequest:
      type: object
      required: [name, strategy, conditions, actions]
      properties:
        name: { type: string, maxLength: 120 }
        strategy: { type: string, enum: [round_robin, load_balancing, territory, industry, product, location, score, availability, manual, custom_rule] }
        match_type: { type: string, enum: [all, any], default: all }
        priority: { type: integer, minimum: 0, maximum: 65535 }
        fallback_user_id: { type: integer, nullable: true, minimum: 1 }
        config: { type: object, nullable: true, additionalProperties: true }
        active: { type: boolean, default: true }
        stop_on_match: { type: boolean, default: true }
        conditions: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/RuleCondition' } }
        actions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [user_id]
            properties:
              user_id: { type: integer, minimum: 1 }
              type: { type: string, enum: [candidate, assign, fallback], default: candidate }
              position: { type: integer, minimum: 0, maximum: 65535 }
              weight: { type: integer, minimum: 1, maximum: 100, default: 1 }
              capacity: { type: integer, nullable: true, minimum: 1 }
              config: { type: object, nullable: true, additionalProperties: true }
    ScoringModelRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 10000 }
        minimum_score: { type: integer, minimum: -100000, maximum: 100000, default: 0 }
        maximum_score: { type: integer, minimum: -100000, maximum: 100000, default: 100 }
        warm_threshold: { type: integer, minimum: -100000, maximum: 100000, default: 40 }
        hot_threshold: { type: integer, minimum: -100000, maximum: 100000, default: 70 }
        is_default: { type: boolean, default: false }
        active: { type: boolean, default: true }
        settings: { type: object, nullable: true, additionalProperties: true }
    ScoringRuleRequest:
      type: object
      required: [name, type, points, conditions]
      properties:
        name: { type: string, maxLength: 120 }
        type: { type: string, enum: [explicit, behavioral, negative] }
        event_type: { type: string, nullable: true, maxLength: 120 }
        points: { type: integer, minimum: -100000, maximum: 100000 }
        priority: { type: integer, minimum: 0, maximum: 65535 }
        match_type: { type: string, enum: [all, any], default: all }
        repeatable: { type: boolean, default: false }
        active: { type: boolean, default: true }
        conditions: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/RuleCondition' } }
    ScoringEventRequest:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string, maxLength: 120, pattern: '^[a-z][a-z0-9_.-]*$' }
        event_key: { type: string, nullable: true, maxLength: 190 }
        metadata: { type: object, nullable: true, additionalProperties: true }
        occurred_at: { type: string, format: date-time, nullable: true }
    SequenceStepRequest:
      type: object
      required: [type, config]
      properties:
        position: { type: integer, minimum: 0, maximum: 65535 }
        type: { type: string, enum: [email, whatsapp, sms, call_task, task, wait, condition, notification] }
        delay_minutes: { type: integer, minimum: 0, maximum: 525600, default: 0 }
        active: { type: boolean, default: true }
        config:
          type: object
          additionalProperties: true
          properties:
            inbox_channel_id: { type: integer, minimum: 1 }
            subject: { type: string, nullable: true, maxLength: 255 }
            body: { type: string, nullable: true, maxLength: 100000 }
            template: { type: object, nullable: true, additionalProperties: true }
            title: { type: string, nullable: true, maxLength: 255 }
            description: { type: string, nullable: true, maxLength: 10000 }
            wait_minutes: { type: integer, minimum: 1, maximum: 525600 }
            conditions: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/RuleCondition' } }
            match_type: { type: string, enum: [all, any] }
            on_false: { type: string, enum: [continue, stop, skip_next] }
            recipient: { type: string, enum: [sender, owner, user] }
            user_id: { type: integer, nullable: true, minimum: 1 }
    SequenceRequest:
      type: object
      required: [name, steps]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 10000 }
        status: { type: string, enum: [draft, active, paused, archived], default: draft }
        stop_conditions:
          type: array
          maxItems: 6
          items: { type: string, enum: [email_reply, whatsapp_reply, meeting_booked, opportunity_created, deal_won, manual_stop] }
        settings: { type: object, nullable: true, additionalProperties: true }
        steps: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SequenceStepRequest' } }
    SequenceEnrollmentRequest:
      type: object
      oneOf:
        - required: [lead_id]
        - required: [contact_id]
      properties:
        lead_id: { type: integer, nullable: true, minimum: 1 }
        contact_id: { type: integer, nullable: true, minimum: 1 }
        sender_user_id: { type: integer, nullable: true, minimum: 1 }
        start_at: { type: string, format: date-time, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
    SequenceControlRequest:
      type: object
      properties: { reason: { type: string, nullable: true, maxLength: 190 } }
    AvailabilityRuleRequest:
      type: object
      required: [day_of_week, start_time, end_time]
      properties:
        user_id: { type: integer, nullable: true, minimum: 1 }
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        timezone: { type: string, nullable: true, example: America/Guayaquil }
        valid_from: { type: string, format: date, nullable: true }
        valid_until: { type: string, format: date, nullable: true }
        active: { type: boolean, default: true }
    MeetingTypeRequest:
      type: object
      required: [name, duration_minutes, timezone, availability]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 10000 }
        host_user_id: { type: integer, nullable: true, minimum: 1 }
        duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
        timezone: { type: string, example: America/Guayaquil }
        buffer_before_minutes: { type: integer, minimum: 0, maximum: 1440 }
        buffer_after_minutes: { type: integer, minimum: 0, maximum: 1440 }
        minimum_notice_minutes: { type: integer, minimum: 0, maximum: 525600 }
        maximum_days_ahead: { type: integer, minimum: 1, maximum: 730 }
        assignment_strategy: { type: string, enum: [fixed, round_robin], default: fixed }
        location_type: { type: string, enum: [google_meet, microsoft_teams, zoom, phone, in_person, custom] }
        location_details: { type: object, nullable: true, additionalProperties: true }
        settings:
          type: object
          nullable: true
          properties:
            slot_interval_minutes: { type: integer, minimum: 5, maximum: 1440 }
            create_lead: { type: boolean, default: true }
            calendar_provider: { type: string, enum: [google, microsoft, zoom] }
        active: { type: boolean, default: true }
        availability: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AvailabilityRuleRequest' } }
        exclusions:
          type: array
          maxItems: 500
          items:
            type: object
            required: [starts_at, ends_at]
            properties:
              user_id: { type: integer, nullable: true, minimum: 1 }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              reason: { type: string, nullable: true, maxLength: 255 }
    MeetingBookingRequest:
      type: object
      required: [starts_at, timezone, invitee_name, invitee_email]
      properties:
        starts_at: { type: string, format: date-time }
        timezone: { type: string, example: America/Guayaquil }
        invitee_name: { type: string, maxLength: 190 }
        invitee_email: { type: string, format: email, maxLength: 190 }
        invitee_phone: { type: string, nullable: true, maxLength: 50 }
        notes: { type: string, nullable: true, maxLength: 10000 }
        idempotency_key: { type: string, nullable: true, minLength: 8, maxLength: 190 }
    MeetingControlRequest:
      type: object
      required: [manage_token]
      properties:
        manage_token: { type: string, writeOnly: true, maxLength: 190 }
        reason: { type: string, nullable: true, maxLength: 500 }
    MeetingRescheduleRequest:
      allOf:
        - { $ref: '#/components/schemas/MeetingControlRequest' }
        - type: object
          required: [starts_at]
          properties:
            starts_at: { type: string, format: date-time }
            timezone: { type: string, nullable: true, example: America/Guayaquil }
    MeetingAdminControlRequest:
      type: object
      properties: { reason: { type: string, nullable: true, maxLength: 500 } }
    CalendarConnectionRequest:
      type: object
      required: [user_id, integration_id, provider]
      properties:
        user_id: { type: integer, minimum: 1 }
        integration_id: { type: integer, minimum: 1 }
        provider: { type: string, enum: [google, microsoft, zoom] }
        external_calendar_id: { type: string, maxLength: 190, default: primary }
        timezone: { type: string, example: America/Guayaquil }
        settings:
          type: object
          nullable: true
          properties:
            schedule_address: { type: string, format: email, nullable: true }
            send_updates: { type: string, enum: [all, externalOnly, none] }
        status: { type: string, enum: [active, inactive, error], default: active }
    DecimalAmount:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]{1,6})?$'
      example: '125.750000'
      description: Decimal serialized as a string; monetary calculations never use binary floating point.
    CurrencyRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 3, maxLength: 3, pattern: '^[A-Z]{3}$', example: USD }
        name: { type: string, maxLength: 100 }
        symbol: { type: string, nullable: true, maxLength: 12 }
        decimal_places: { type: integer, minimum: 0, maximum: 6, default: 2 }
        exchange_rate: { $ref: '#/components/schemas/DecimalAmount' }
        is_base: { type: boolean, default: false }
        active: { type: boolean, default: true }
    ProductCategoryRequest:
      type: object
      required: [name]
      properties:
        parent_id: { type: integer, nullable: true, minimum: 1 }
        name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true, maxLength: 10000 }
        position: { type: integer, minimum: 0 }
        active: { type: boolean, default: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
    ProductRequest:
      type: object
      required: [currency_id, type, sku, name, base_price]
      properties:
        category_id: { type: integer, nullable: true, minimum: 1 }
        currency_id: { type: integer, minimum: 1 }
        type: { type: string, enum: [product, service, subscription, bundle] }
        sku: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, maxLength: 190 }
        description: { type: string, nullable: true, maxLength: 50000 }
        unit_of_measure: { type: string, maxLength: 40, default: unit }
        base_price: { $ref: '#/components/schemas/DecimalAmount' }
        cost: { $ref: '#/components/schemas/DecimalAmount' }
        taxable: { type: boolean, default: true }
        active: { type: boolean, default: true }
        erp_product_id: { type: string, nullable: true, maxLength: 190 }
        custom_fields: { type: object, nullable: true, additionalProperties: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        tax_ids: { type: array, maxItems: 20, uniqueItems: true, items: { type: integer, minimum: 1 } }
    ProductVariantRequest:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$' }
        name: { type: string, maxLength: 190 }
        attributes: { type: object, nullable: true, additionalProperties: true }
        price_adjustment: { $ref: '#/components/schemas/DecimalAmount' }
        cost: { $ref: '#/components/schemas/DecimalAmount' }
        active: { type: boolean, default: true }
        erp_product_id: { type: string, nullable: true, maxLength: 190 }
    TaxRequest:
      type: object
      required: [code, name, calculation, rate]
      properties:
        currency_id: { type: integer, nullable: true, minimum: 1, description: Required for fixed taxes. }
        code: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 120 }
        calculation: { type: string, enum: [percentage, fixed] }
        rate: { $ref: '#/components/schemas/DecimalAmount' }
        inclusive: { type: boolean, default: false }
        compound: { type: boolean, default: false }
        priority: { type: integer, minimum: 0 }
        active: { type: boolean, default: true }
        settings: { type: object, nullable: true, additionalProperties: true }
    DiscountRequest:
      type: object
      required: [code, name, type, value]
      properties:
        currency_id: { type: integer, nullable: true, minimum: 1, description: Required for fixed discounts. }
        code: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 160 }
        type: { type: string, enum: [percentage, fixed] }
        value: { $ref: '#/components/schemas/DecimalAmount' }
        minimum_subtotal: { $ref: '#/components/schemas/DecimalAmount' }
        maximum_discount: { $ref: '#/components/schemas/DecimalAmount' }
        usage_limit: { type: integer, nullable: true, minimum: 1 }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        active: { type: boolean, default: true }
        conditions: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/RuleCondition' } }
    BundleItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, minimum: 1 }
        product_variant_id: { type: integer, nullable: true, minimum: 1 }
        quantity: { $ref: '#/components/schemas/DecimalAmount' }
        price_override: { $ref: '#/components/schemas/DecimalAmount' }
        required: { type: boolean, default: true }
        position: { type: integer, minimum: 0 }
    BundleRequest:
      type: object
      required: [product_id, name, pricing_method, items]
      properties:
        product_id: { type: integer, minimum: 1 }
