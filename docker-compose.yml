services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -lc "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build: .
    env_file: .env
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    depends_on:
      - app
    command: php artisan horizon

  reverb:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -c "until mc alias set local http://minio:9000 minio minio123; do sleep 1; done; mc mb --ignore-existing local/crm"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  vendor-data:
